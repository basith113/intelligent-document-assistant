services:
  api:
    build: .
    env_file: .env
    environment:
      CHROMA_PATH: /app/storage/chroma_db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - knowledge_storage:/app/storage/chroma_db
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: .
    command: ["python", "-m", "streamlit", "run", "frontend/streamlit_app.py", "--server.address=0.0.0.0", "--server.maxUploadSize=100"]
    environment:
      RAG_API_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  knowledge_storage:
